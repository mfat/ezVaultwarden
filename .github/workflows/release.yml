name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/mfat/ezVaultwarden/internal/cli.Version=$VERSION" \
              -o "dist/ezvaultwarden_linux_$arch" ./cmd/ezvaultwarden
          done
          cd dist && sha256sum ezvaultwarden_linux_* > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        # Not a prerelease: GitHub's latest/download link, which install.sh uses, skips those.
        run: gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes
